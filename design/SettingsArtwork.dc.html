<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Salon settings — Artwork</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.light{--desk:#DAD4C9;--paper:#F4F0E8;--surface:#FAF8F3;--ink:#221F1A;--ink2:#5B5449;--ink3:#6E675B;--rule:#E2DCD0;--fill:#E6E0D5;--ring:rgba(34,31,26,.14);--chrome:#EFEBE3;--on:#4A453D;--knob:#FFFFFF;--a:#7A5C22;--a-soft:rgba(122,92,34,.11)}
.sans{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif}
.serif{font-family:ui-serif,"New York","Source Serif 4",Georgia,serif}
.caps{font-size:10.5px;line-height:14px;letter-spacing:.09em;text-transform:uppercase;font-weight:500}
.win{width:680px;border-radius:12px;overflow:hidden;background:var(--paper);box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 18px 50px rgba(34,31,26,.22);display:flex;flex-direction:column}
.tb{background:var(--chrome);border-bottom:.5px solid var(--rule);padding:10px 16px 8px;display:flex;flex-direction:column;gap:6px}
.tabs{display:flex;justify-content:center;gap:2px}
.tab{all:unset;box-sizing:border-box;width:68px;height:50px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--a-soft);color:var(--a)}
.form{padding:20px 28px 28px;display:flex;flex-direction:column;gap:8px}
.gh{margin:12px 4px 0;color:var(--ink3)}
.group{background:var(--surface);border-radius:10px;box-shadow:0 0 0 .5px var(--rule)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;padding:9px 14px;box-sizing:border-box}
.row + .row{border-top:.5px solid var(--rule)}
.lbl{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:17px;color:var(--ink)}
.help{font-size:11.5px;line-height:15px;color:var(--ink3)}
.sw{all:unset;box-sizing:border-box;width:32px;height:18px;border-radius:9px;background:var(--fill);position:relative;flex:none;box-shadow:inset 0 0 0 .5px var(--ring)}
.sw::after{content:"";position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:8px;background:var(--knob);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--on)}
.sw[aria-checked="true"]::after{left:15px}
.cb{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink)}
.box{width:14px;height:14px;box-sizing:border-box;border-radius:3.5px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--ring),0 .5px 1px rgba(0,0,0,.08);display:inline-flex;align-items:center;justify-content:center}
.box.on{background:var(--on);box-shadow:none}
.rd{width:14px;height:14px;box-sizing:border-box;border-radius:7px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--ring),0 .5px 1px rgba(0,0,0,.08);display:inline-flex;align-items:center;justify-content:center;flex:none}
.rd.on{background:var(--on);box-shadow:none}
.rd.on::after{content:"";width:5px;height:5px;border-radius:3px;background:#fff}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:var(--fill);gap:2px}
.seg button{all:unset;box-sizing:border-box;height:20px;padding:0 12px;border-radius:5px;font-size:12px;color:var(--ink2);display:inline-flex;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 .5px var(--ring),0 1px 2px rgba(0,0,0,.08)}
.p-milkmaid{background:radial-gradient(ellipse 10% 8% at 47% 19%,#E6DBC1 0 55%,transparent 62%),radial-gradient(ellipse 19% 22% at 47% 40%,#D2AB45 0 58%,transparent 64%),radial-gradient(ellipse 18% 24% at 50% 66%,#3E5B8E 0 58%,transparent 64%),radial-gradient(ellipse 22% 10% at 26% 76%,#A86A3A 0 50%,transparent 62%),linear-gradient(180deg,transparent 72%,#4E4029 72% 100%),radial-gradient(ellipse 42% 36% at 16% 18%,#D6CDB4 0%,transparent 72%),linear-gradient(135deg,#ADA389 0%,#8F846B 52%,#665C49 100%)}
</style>
</helmet>
<div class="sans light" style="width:760px;height:960px;box-sizing:border-box;padding:40px;background:var(--desk)">
<section class="win" aria-label="Salon Settings">
<div class="tb">
<div style="display:flex;align-items:center;height:16px"><div style="display:flex;gap:8px" aria-hidden="true"><span style="width:12px;height:12px;border-radius:6px;background:#FF5F57"></span><span style="width:12px;height:12px;border-radius:6px;background:#FEBC2E"></span><span style="width:12px;height:12px;border-radius:6px;background:#28C840"></span></div><span style="flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--ink);margin-right:52px">Artwork</span></div>
<div class="tabs" role="tablist">
<button class="tab" role="tab" aria-selected="false"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg>General</button>
<button class="tab" role="tab" aria-selected="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="1"/><rect x="6" y="7" width="8" height="6"/></svg>Artwork</button>
<button class="tab" role="tab" aria-selected="false"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 7.5L10 3.5l7 4M3.5 16.5h13M5.5 9.5v5M8.5 9.5v5M11.5 9.5v5M14.5 9.5v5M3 7.5h14"/></svg>Sources</button>
<button class="tab" role="tab" aria-selected="false"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="14" height="8" rx="1.5"/><path d="M6 10h4"/><circle cx="14" cy="10" r=".8" fill="currentColor"/></svg>Storage</button>
<button class="tab" role="tab" aria-selected="false"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 9v5"/><circle cx="10" cy="6.3" r=".8" fill="currentColor"/></svg>About</button>
</div>
</div>

<div class="form">
<span class="caps gh" style="margin-top:0">Selection</span>
<div class="group">
<div class="row"><div class="lbl">Include<span class="help">Paintings only, unless you add more.</span></div>
<div style="display:flex;gap:16px">
<label class="cb"><span class="box on" aria-hidden="true"><svg width="9" height="8" viewBox="0 0 9 8" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4.2L3.4 6.5 8 1.2"/></svg></span><input type="checkbox" checked="" style="display:none">Paintings</label>
<label class="cb"><span class="box" aria-hidden="true"></span><input type="checkbox" style="display:none">Prints</label>
<label class="cb"><span class="box" aria-hidden="true"></span><input type="checkbox" style="display:none">Drawings</label>
</div></div>
<div class="row"><div class="lbl">Highlights only<span class="help">Only works a museum marks as a highlight of its collection.</span></div><button class="sw" role="switch" aria-checked="true" aria-label="Highlights only"></button></div>
<div class="row"><div class="lbl">With several displays</div>
<div class="seg" role="group" aria-label="Displays"><button aria-pressed="true">Same work on all</button><button aria-pressed="false">A different work on each</button></div></div>
</div>

<span class="caps gh">Mat</span>
<div class="group">
<div class="row" style="align-items:flex-start;padding-top:12px;padding-bottom:12px"><div class="lbl">Colour</div>
<div role="radiogroup" aria-label="Mat colour" style="display:flex;flex-direction:column;gap:9px;width:300px">
<label class="cb" style="align-items:flex-start"><span class="rd on" aria-hidden="true" style="margin-top:1.5px"></span><span style="display:flex;flex-direction:column;gap:2px">Auto<span class="help">A quiet tone sampled from the painting’s edges.</span></span></label>
<label class="cb"><span class="rd" aria-hidden="true"></span>Fixed neutral</label>
<label class="cb"><span class="rd" aria-hidden="true"></span>Custom<span style="margin-left:6px;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 4px 0 3px;border-radius:5px;box-shadow:0 0 0 .5px var(--ring);background:var(--surface);opacity:.5"><span style="width:26px;height:14px;border-radius:3px;background:#2F3A3A"></span><svg width="7" height="10" viewBox="0 0 7 10" fill="none" stroke="var(--ink2)" stroke-width="1.1" aria-hidden="true"><path d="M.8 3.5L3.5.8l2.7 2.7M.8 6.5l2.7 2.7 2.7-2.7"/></svg></span></label>
</div></div>
<div class="row"><div class="lbl">Margin</div>
<div class="seg" role="group" aria-label="Margin"><button aria-pressed="false">Small</button><button aria-pressed="true">Medium</button><button aria-pressed="false">Large</button></div></div>
<div class="row" style="flex-direction:column;align-items:center;gap:10px;padding:20px 14px 18px">
<div aria-label="Preview of the wallpaper with an auto mat and medium margin" role="img" style="width:288px;height:180px;border-radius:6px;background:#3D372E;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .5px var(--ring),0 4px 14px rgba(0,0,0,.14);overflow:hidden">
<div style="position:absolute;left:0;right:0;top:0;height:7px;background:rgba(255,255,255,.08)"></div>
<div class="p-milkmaid" style="width:108px;height:120px;margin-top:-2px;box-shadow:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.28)"></div>
</div>
<span class="help">Preview · The Milkmaid · auto mat #3D372E · medium margin</span>
</div>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":960}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
