<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Salon collection — no kept works</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.dark{--desk:#121110;--paper:#1C1A17;--surface:#24211D;--ink:#EEE9E0;--ink2:#B8B0A3;--ink3:#9A9285;--rule:#37322C;--fill:#2F2B26;--mat:#262320;--ring:rgba(238,233,224,.12);--chrome:#2A2622}
.sans{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif}
.serif{font-family:ui-serif,"New York","Source Serif 4",Georgia,serif}
.caps{font-size:10.5px;line-height:14px;letter-spacing:.09em;text-transform:uppercase;font-weight:500}
.tnum{font-variant-numeric:tabular-nums}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:var(--fill);gap:2px}
.seg button{all:unset;box-sizing:border-box;height:24px;padding:0 14px;border-radius:5px;font-size:12.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:#3A352F;color:var(--ink);box-shadow:0 0 0 .5px var(--ring),0 1px 2px rgba(0,0,0,.3)}
.push{all:unset;box-sizing:border-box;height:30px;padding:0 16px;border-radius:6px;display:inline-flex;align-items:center;font-size:13px;color:var(--ink);background:#3A352F;box-shadow:0 0 0 .5px var(--ring)}
</style>
</helmet>
<div class="sans dark" style="width:1180px;height:800px;box-sizing:border-box;padding:40px;background:var(--desk)">
<section aria-label="Salon — Collection" style="width:1100px;height:720px;border-radius:12px;overflow:hidden;background:var(--paper);box-shadow:0 0 0 .5px rgba(255,255,255,.1),0 18px 50px rgba(0,0,0,.55);display:flex;flex-direction:column">
<div style="height:52px;flex:none;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--chrome);border-bottom:.5px solid var(--rule)">
<div style="display:flex;gap:8px" aria-hidden="true"><span style="width:12px;height:12px;border-radius:6px;background:#FF5F57"></span><span style="width:12px;height:12px;border-radius:6px;background:#FEBC2E"></span><span style="width:12px;height:12px;border-radius:6px;background:#28C840"></span></div>
<span style="font-size:13px;font-weight:600;color:var(--ink);margin-left:8px">Collection</span>
<div style="flex:1;display:flex;justify-content:center">
<div class="seg" role="group" aria-label="Show"><button aria-pressed="false">All <span class="tnum" style="color:var(--ink3)">3</span></button><button aria-pressed="true">Kept <span class="tnum" style="color:var(--ink3)">0</span></button></div>
</div>
<label style="display:flex;align-items:center;gap:6px;width:200px;height:28px;box-sizing:border-box;padding:0 8px;border-radius:6px;background:var(--fill);opacity:.6">
<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="var(--ink3)" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="4.2"/><path d="M9.2 9.2L12.5 12.5"/></svg>
<input type="search" disabled="" placeholder="Title, artist, museum" aria-label="Search collection" style="all:unset;flex:1;font-size:12.5px;color:var(--ink)">
</label>
</div>
<div style="flex:1;display:flex;align-items:center;justify-content:center">
<div style="display:flex;flex-direction:column;align-items:center;gap:22px;max-width:380px;text-align:center">
<div aria-hidden="true" style="position:relative;width:148px;height:120px;display:flex;align-items:flex-end;justify-content:center">
<svg width="148" height="34" viewBox="0 0 148 34" fill="none" stroke="var(--ink3)" stroke-width="1" style="position:absolute;top:0;left:0;opacity:.7"><path d="M74 4L34 30M74 4l40 26"/><circle cx="74" cy="4" r="2.2" fill="var(--ink3)" stroke="none"/></svg>
<div style="width:120px;height:90px;box-sizing:border-box;border:1px solid var(--ink3);opacity:.7;padding:9px"><div style="width:100%;height:100%;border:.5px solid var(--rule)"></div></div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<span class="caps" style="color:var(--ink3)">Kept · 0 works</span>
<h2 class="serif" style="margin:0;font-size:26px;line-height:32px;font-weight:400;color:var(--ink)">Nothing kept yet</h2>
<p class="serif" style="margin:0;font-size:15px;line-height:23px;color:var(--ink2)">When a work stays with you, press Keep on the menu-bar card. It will hang here, and Salon can show it again whenever you like.</p>
</div>
<button class="push">Browse All Works</button>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
