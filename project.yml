# Generates Salon.xcodeproj with XcodeGen (`make project`). The .xcodeproj is not committed.
name: Salon
options:
  bundleIdPrefix: xyz.bogdansimon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Salon:
    type: application
    platform: macOS
    sources:
      - path: Salon
    dependencies:
      - target: SalonCore
        embed: false
    info:
      path: Salon/Resources/Info.plist
      properties:
        CFBundleDisplayName: Salon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.lifestyle
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "MIT License"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.bogdansimon.salon
        PRODUCT_NAME: Salon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  # Static, so its code links into the app binary. A dynamic framework signed
  # ad hoc (no Team ID) is rejected by Hardened Runtime library validation and
  # the Release app dies in dyld at launch.
  SalonCore:
    type: framework.static
    platform: macOS
    sources:
      - path: SalonCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.bogdansimon.salon.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES

  SalonCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SalonCoreTests
        excludes:
          - "Fixtures"
      - path: SalonCoreTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: SalonCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.bogdansimon.salon.core-tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Salon:
    build:
      targets:
        Salon: all
        SalonCore: all
        SalonCoreTests: [test]
    test:
      targets:
        - SalonCoreTests
    run:
      config: Debug
    archive:
      config: Release
